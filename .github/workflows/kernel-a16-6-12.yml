name: 完整源码环境发布 - Android 16 (6.12)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
      kernelsu_variant:
        required: false
        type: string
      kernelsu_branch:
        required: false
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
      use_zram:
        required: false
        type: boolean
        default: false
      use_bbg:
        required: false
        type: boolean
        default: false
      use_kpm:
        required: false
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
      called_from_main:
        required: false
        type: boolean
        default: false

jobs:
  prepare-release:
    name: 生成 Release 标签
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: 生成 Release 标签
        id: release
        run: |
          set -euo pipefail
          RELEASE_TAG="android16-6.12-full-sources-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Release 标签：${RELEASE_TAG}"

  publish-sources:
    needs: prepare-release
    name: "6.12.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sub_level: "23"
            os_patch_level: "2025-06"
          - sub_level: "30"
            os_patch_level: "2025-07"
          - sub_level: "38"
            os_patch_level: "2025-09"
          - sub_level: "58"
            os_patch_level: "2025-12"
          - sub_level: "69"
            os_patch_level: "2026-03"
          - sub_level: "81"
            os_patch_level: "2026-06"
          - sub_level: "X"
            os_patch_level: "lts"
    uses: ./.github/workflows/kernel-full-release.yml
    secrets: inherit
    with:
      android_version: "android16"
      kernel_version: "6.12"
      os_patch_level: ${{ matrix.os_patch_level }}
      release_tag: ${{ inputs.release_tag || needs.prepare-release.outputs.release_tag }}
