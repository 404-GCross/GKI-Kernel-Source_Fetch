name: 完整源码环境发布 - Android 12 (5.10)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "上传到的 Release 标签"
        required: true
        type: string
        default: "full-kernel-sources"
      part_size:
        description: "分卷大小，需低于 GitHub 单 asset 限制"
        required: true
        type: string
        default: "1900M"
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: "full-kernel-sources"
      part_size:
        required: false
        type: string
        default: "1900M"
      kernelsu_variant:
        required: false
        type: string
      kernelsu_branch:
        required: false
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
      use_zram:
        required: false
        type: boolean
        default: false
      use_bbg:
        required: false
        type: boolean
        default: false
      use_kpm:
        required: false
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
      called_from_main:
        required: false
        type: boolean
        default: false

jobs:
  publish-sources:
    name: "5.10.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sub_level: "43"
            os_patch_level: "2021-10"
          - sub_level: "66"
            os_patch_level: "2022-01"
          - sub_level: "81"
            os_patch_level: "2022-03"
          - sub_level: "101"
            os_patch_level: "2022-04"
          - sub_level: "110"
            os_patch_level: "2022-07"
          - sub_level: "117"
            os_patch_level: "2022-09"
          - sub_level: "136"
            os_patch_level: "2022-11"
          - sub_level: "149"
            os_patch_level: "2023-01"
          - sub_level: "160"
            os_patch_level: "2023-03"
          - sub_level: "168"
            os_patch_level: "2023-04"
          - sub_level: "177"
            os_patch_level: "2023-07"
          - sub_level: "185"
            os_patch_level: "2023-09"
          - sub_level: "198"
            os_patch_level: "2024-01"
          - sub_level: "205"
            os_patch_level: "2024-03"
          - sub_level: "209"
            os_patch_level: "2024-05"
          - sub_level: "218"
            os_patch_level: "2024-08"
          - sub_level: "226"
            os_patch_level: "2024-11"
          - sub_level: "233"
            os_patch_level: "2025-02"
          - sub_level: "236"
            os_patch_level: "2025-05"
          - sub_level: "237"
            os_patch_level: "2025-06"
          - sub_level: "240"
            os_patch_level: "2025-09"
          - sub_level: "246"
            os_patch_level: "2025-12"
          - sub_level: "X"
            os_patch_level: "lts"
    uses: ./.github/workflows/kernel-full-release.yml
    secrets: inherit
    with:
      android_version: "android12"
      kernel_version: "5.10"
      os_patch_level: ${{ matrix.os_patch_level }}
      release_tag: ${{ inputs.release_tag || 'full-kernel-sources' }}
      part_size: ${{ inputs.part_size || '1900M' }}
