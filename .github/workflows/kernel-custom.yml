name: 完整源码环境发布-自定义

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 内核版本配置 ====================
      android_version:
        description: "Android 版本"
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
          - android17
        default: android12
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
          - "6.18"
        default: "5.10"
      os_patch_level:
        description: "安全补丁级别或 lts，例如 2026-06 / lts"
        required: true
        type: string
        default: "2022-01"
      release_tag:
        description: "上传到的 Release 标签"
        required: true
        type: string
        default: "full-kernel-sources"
      part_size:
        description: "分卷大小，需低于 GitHub 单 asset 限制"
        required: true
        type: string
        default: "1800M"

jobs:
  publish-full-source:
    uses: ./.github/workflows/kernel-full-release.yml
    secrets: inherit
    with:
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      os_patch_level: ${{ inputs.os_patch_level }}
      release_tag: ${{ inputs.release_tag }}
      part_size: ${{ inputs.part_size }}
