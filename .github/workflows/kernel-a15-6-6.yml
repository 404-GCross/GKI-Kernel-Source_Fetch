name: 完整源码环境发布 - Android 15 (6.6)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "上传到的 Release 标签"
        required: true
        type: string
        default: "full-kernel-sources"
      part_size:
        description: "分卷大小，需低于 GitHub 单 asset 限制"
        required: true
        type: string
        default: "1900M"
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: "full-kernel-sources"
      part_size:
        required: false
        type: string
        default: "1900M"
      kernelsu_variant:
        required: false
        type: string
      kernelsu_branch:
        required: false
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
      use_zram:
        required: false
        type: boolean
        default: false
      use_bbg:
        required: false
        type: boolean
        default: false
      use_kpm:
        required: false
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
      called_from_main:
        required: false
        type: boolean
        default: false

jobs:
  publish-sources:
    name: "6.6.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sub_level: "50"
            os_patch_level: "2024-10"
          - sub_level: "56"
            os_patch_level: "2024-11"
          - sub_level: "57"
            os_patch_level: "2024-12"
          - sub_level: "58"
            os_patch_level: "2025-01"
          - sub_level: "66"
            os_patch_level: "2025-02"
          - sub_level: "77"
            os_patch_level: "2025-03"
          - sub_level: "82"
            os_patch_level: "2025-04"
          - sub_level: "87"
            os_patch_level: "2025-05"
          - sub_level: "89"
            os_patch_level: "2025-06"
          - sub_level: "92"
            os_patch_level: "2025-07"
          - sub_level: "98"
            os_patch_level: "2025-09"
          - sub_level: "102"
            os_patch_level: "2025-10"
          - sub_level: "118"
            os_patch_level: "2026-01"
          - sub_level: "127"
            os_patch_level: "2026-04"
          - sub_level: "139"
            os_patch_level: "2026-07"
          - sub_level: "X"
            os_patch_level: "lts"
    uses: ./.github/workflows/kernel-full-release.yml
    secrets: inherit
    with:
      android_version: "android15"
      kernel_version: "6.6"
      os_patch_level: ${{ matrix.os_patch_level }}
      release_tag: ${{ inputs.release_tag || 'full-kernel-sources' }}
      part_size: ${{ inputs.part_size || '1900M' }}
