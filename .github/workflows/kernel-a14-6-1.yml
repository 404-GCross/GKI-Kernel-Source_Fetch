name: 完整源码环境发布 - Android 14 (6.1)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch: {}
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
      kernelsu_variant:
        required: false
        type: string
      kernelsu_branch:
        required: false
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
      use_zram:
        required: false
        type: boolean
        default: false
      use_bbg:
        required: false
        type: boolean
        default: false
      use_kpm:
        required: false
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
      called_from_main:
        required: false
        type: boolean
        default: false

jobs:
  prepare-release:
    name: 生成 Release 标签
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
    steps:
      - name: 生成 Release 标签
        id: release
        run: |
          set -euo pipefail
          RELEASE_TAG="android14-6.1-full-sources-$(date -u +%Y%m%d)-${GITHUB_RUN_ID}"
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Release 标签：${RELEASE_TAG}"

  publish-sources:
    needs: prepare-release
    name: "6.1.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sub_level: "25"
            os_patch_level: "2023-10"
          - sub_level: "43"
            os_patch_level: "2023-11"
          - sub_level: "57"
            os_patch_level: "2024-01"
          - sub_level: "68"
            os_patch_level: "2024-03"
          - sub_level: "75"
            os_patch_level: "2024-05"
          - sub_level: "78"
            os_patch_level: "2024-06"
          - sub_level: "84"
            os_patch_level: "2024-07"
          - sub_level: "90"
            os_patch_level: "2024-08"
          - sub_level: "93"
            os_patch_level: "2024-09"
          - sub_level: "99"
            os_patch_level: "2024-10"
          - sub_level: "112"
            os_patch_level: "2024-11"
          - sub_level: "115"
            os_patch_level: "2024-12"
          - sub_level: "118"
            os_patch_level: "2025-01"
          - sub_level: "124"
            os_patch_level: "2025-02"
          - sub_level: "128"
            os_patch_level: "2025-03"
          - sub_level: "129"
            os_patch_level: "2025-04"
          - sub_level: "134"
            os_patch_level: "2025-05"
          - sub_level: "138"
            os_patch_level: "2025-06"
          - sub_level: "141"
            os_patch_level: "2025-07"
          - sub_level: "145"
            os_patch_level: "2025-09"
          - sub_level: "157"
            os_patch_level: "2025-12"
          - sub_level: "162"
            os_patch_level: "2026-03"
          - sub_level: "172"
            os_patch_level: "2026-06"
          - sub_level: "X"
            os_patch_level: "lts"
    uses: ./.github/workflows/kernel-full-release.yml
    secrets: inherit
    with:
      android_version: "android14"
      kernel_version: "6.1"
      os_patch_level: ${{ matrix.os_patch_level }}
      release_tag: ${{ inputs.release_tag || needs.prepare-release.outputs.release_tag }}
