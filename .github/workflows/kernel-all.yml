name: 一键拉取全部完整源码并推送 Release

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      include_lts:
        description: "是否包含各内核 LTS 分支"
        required: true
        type: boolean
        default: true

jobs:
  prepare-matrix:
    name: 生成完整源码版本矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
      release_tag: ${{ steps.matrix.outputs.release_tag }}

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 生成矩阵
        id: matrix
        run: |
          set -euo pipefail

          python3 << 'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          include_lts = "${{ inputs.include_lts }}" == "true"
          release_date = datetime.datetime.utcnow().strftime("%Y%m%d")
          release_tag = f"all-full-kernel-sources-{release_date}-{os.environ['GITHUB_RUN_ID']}"
          data_dir = Path("data")
          order = {
              ("android12", "5.10"): 0,
              ("android13", "5.15"): 1,
              ("android14", "6.1"): 2,
              ("android15", "6.6"): 3,
              ("android16", "6.12"): 4,
              ("android17", "6.18"): 5,
          }

          rows = []
          paths = sorted(
              data_dir.glob("android*/*.json"),
              key=lambda p: order.get((p.parent.name, p.stem), 999),
          )

          for path in paths:
              data = json.loads(path.read_text(encoding="utf-8"))
              android = data["android_version"]
              kernel = data["kernel_version"]

              for entry in data.get("entries", []):
                  rows.append({
                      "android_version": android,
                      "kernel_version": kernel,
                      "os_patch_level": entry["date"],
                  })

              if include_lts and data.get("lts"):
                  rows.append({
                      "android_version": android,
                      "kernel_version": kernel,
                      "os_patch_level": "lts",
                  })

          if not rows:
              raise SystemExit("未从 data/android*/*.json 生成任何版本矩阵")

          payload = json.dumps(rows, ensure_ascii=False, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"matrix={payload}", file=output)
              print(f"count={len(rows)}", file=output)
              print(f"release_tag={release_tag}", file=output)

          print(f"生成 {len(rows)} 个完整源码环境任务")
          print(f"Release 标签：{release_tag}")
          PY

  publish-full-sources:
    name: "${{ matrix.android_version }}-${{ matrix.kernel_version }}-${{ matrix.os_patch_level }}"
    needs: prepare-matrix
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    uses: ./.github/workflows/kernel-full-release.yml
    secrets: inherit
    with:
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}
      os_patch_level: ${{ matrix.os_patch_level }}
      release_tag: ${{ needs.prepare-matrix.outputs.release_tag }}

  update-download-scripts:
    name: 更新下载脚本 Release 指针
    needs: [prepare-matrix, publish-full-sources]
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 更新脚本中的仓库与 Release 标签
        run: |
          set -euo pipefail

          RELEASE_REPO="${{ github.repository }}"
          RELEASE_TAG="${{ needs.prepare-matrix.outputs.release_tag }}"

          git pull --rebase origin "${GITHUB_REF_NAME}"

          for script in fetch_kernel_source.sh fetch_kernel_source_no-extract.sh; do
            sed -i -E "s|^REPO=.*|REPO=\"${RELEASE_REPO}\"|" "$script"
            sed -i -E "s|^TAG=.*|TAG=\"${RELEASE_TAG}\"|" "$script"
          done

          if git diff --quiet -- fetch_kernel_source.sh fetch_kernel_source_no-extract.sh; then
            echo "下载脚本已指向 ${RELEASE_REPO}/${RELEASE_TAG}，无需更新。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add fetch_kernel_source.sh fetch_kernel_source_no-extract.sh
          git commit -m "chore: update source download release tag to ${RELEASE_TAG}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
