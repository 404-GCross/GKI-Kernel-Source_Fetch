name: 一键拉取全部完整源码并推送 Release

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "上传到的 Release 标签"
        required: true
        type: string
        default: "all-full-kernel-sources"
      part_size:
        description: "分卷大小，需低于 GitHub 单 asset 限制"
        required: true
        type: string
        default: "1900M"
      include_lts:
        description: "是否包含各内核 LTS 分支"
        required: true
        type: boolean
        default: true

jobs:
  prepare-matrix:
    name: 生成完整源码版本矩阵
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 生成矩阵
        id: matrix
        run: |
          set -euo pipefail

          python3 << 'PY'
          import json
          import os
          from pathlib import Path

          include_lts = "${{ inputs.include_lts }}" == "true"
          data_dir = Path("data")
          order = {
              ("android12", "5.10"): 0,
              ("android13", "5.15"): 1,
              ("android14", "6.1"): 2,
              ("android15", "6.6"): 3,
              ("android16", "6.12"): 4,
              ("android17", "6.18"): 5,
          }

          rows = []
          paths = sorted(
              data_dir.glob("android*/*.json"),
              key=lambda p: order.get((p.parent.name, p.stem), 999),
          )

          for path in paths:
              data = json.loads(path.read_text(encoding="utf-8"))
              android = data["android_version"]
              kernel = data["kernel_version"]

              for entry in data.get("entries", []):
                  rows.append({
                      "android_version": android,
                      "kernel_version": kernel,
                      "os_patch_level": entry["date"],
                  })

              if include_lts and data.get("lts"):
                  rows.append({
                      "android_version": android,
                      "kernel_version": kernel,
                      "os_patch_level": "lts",
                  })

          if not rows:
              raise SystemExit("未从 data/android*/*.json 生成任何版本矩阵")

          payload = json.dumps(rows, ensure_ascii=False, separators=(",", ":"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"matrix={payload}", file=output)
              print(f"count={len(rows)}", file=output)

          print(f"生成 {len(rows)} 个完整源码环境任务")
          PY

  publish-full-sources:
    name: "${{ matrix.android_version }}-${{ matrix.kernel_version }}-${{ matrix.os_patch_level }}"
    needs: prepare-matrix
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    uses: ./.github/workflows/kernel-full-release.yml
    secrets: inherit
    with:
      android_version: ${{ matrix.android_version }}
      kernel_version: ${{ matrix.kernel_version }}
      os_patch_level: ${{ matrix.os_patch_level }}
      release_tag: ${{ inputs.release_tag }}
      part_size: ${{ inputs.part_size }}
