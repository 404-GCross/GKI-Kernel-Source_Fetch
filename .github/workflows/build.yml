name: 内核源码拉取

permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sub_level:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      release_tag:
        required: false
        type: string
        default: ''

jobs:
  publish-source:
    name: "源码 ${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.os_patch_level }}"
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 打印配置摘要
        run: |
          echo "========================================"
          echo "       内核源码拉取配置"
          echo "========================================"
          echo "Android 版本  : ${{ inputs.android_version }}"
          echo "内核版本      : ${{ inputs.kernel_version }}"
          echo "子版本号      : ${{ inputs.sub_level }}"
          echo "补丁级别      : ${{ inputs.os_patch_level }}"
          echo "========================================"

      - name: 清理磁盘空间
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz"
          rmz_version: "3.1.1"
          testing: false

      - name: 检出代码仓库
        uses: actions/checkout@v4

      - name: 初始化目录与环境变量
        run: |
          CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.sub_level }}"
          KERNEL_ROOT="$GITHUB_WORKSPACE/$CONFIG"
          mkdir -p "$KERNEL_ROOT"

          cat >> $GITHUB_ENV << EOF
          CONFIG=$CONFIG
          KERNEL_ROOT=$KERNEL_ROOT
          EOF

          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod 0755 "$GITHUB_WORKSPACE/git-repo/repo"
          echo "$GITHUB_WORKSPACE/git-repo" >> "$GITHUB_PATH"
          echo "REPO=$GITHUB_WORKSPACE/git-repo/repo" >> $GITHUB_ENV

      - name: 配置 Git
        run: |
          git config --global user.name "BuildBot"
          git config --global user.email "BuildGkiKernel@gmail.com"

      - name: 同步内核源码
        working-directory: ${{ env.KERNEL_ROOT }}
        run: |
          FORMATTED_BRANCH="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}"
          echo "初始化 repo，分支: common-${FORMATTED_BRANCH}"

          $REPO init -u https://android.googlesource.com/kernel/manifest -b common-${FORMATTED_BRANCH} --repo-rev=v2.16

          REMOTE_BRANCH=$(git ls-remote https://android.googlesource.com/kernel/common ${FORMATTED_BRANCH})
          DEFAULT_MANIFEST_PATH=.repo/manifests/default.xml

          if grep -q deprecated <<< "$REMOTE_BRANCH"; then
            echo "检测到已弃用的分支，调整 manifest"
            sed -i "s/\"${FORMATTED_BRANCH}\"/\"deprecated\/${FORMATTED_BRANCH}\"/g" $DEFAULT_MANIFEST_PATH
          fi

          # 带重试的 repo sync，应对 Google 服务器间歇性限制
          REPO_SYNC_MAX_RETRIES=3
          for i in $(seq 1 $REPO_SYNC_MAX_RETRIES); do
            echo "repo sync 尝试 $i/$REPO_SYNC_MAX_RETRIES ..."
            if $REPO --trace sync -c -j4 --no-tags --fail-fast; then
              echo "repo sync 成功！"
              break
            fi
            if [ $i -lt $REPO_SYNC_MAX_RETRIES ]; then
              WAIT=$(( i * 30 + RANDOM % 15 ))
              echo "repo sync 失败，等待 ${WAIT} 秒后重试..."
              sleep $WAIT
            else
              echo "repo sync 最终失败！"
              exit 1
            fi
          done

      - name: 提取实际子版本号
        run: |
          ACTUAL_SUBLEVEL="${{ inputs.sub_level }}"
          if [[ -f "$KERNEL_ROOT/common/Makefile" ]]; then
            EXTRACTED=$(grep '^SUBLEVEL = ' "$KERNEL_ROOT/common/Makefile" | awk '{print $3}')
            [[ -n "$EXTRACTED" ]] && ACTUAL_SUBLEVEL="$EXTRACTED"
          fi
          echo "ACTUAL_SUBLEVEL=$ACTUAL_SUBLEVEL" >> $GITHUB_ENV
          REAL_CONFIG="${{ inputs.android_version }}-${{ inputs.kernel_version }}-${ACTUAL_SUBLEVEL}"
          echo "REAL_CONFIG=$REAL_CONFIG" >> $GITHUB_ENV
          echo "实际子版本号: $ACTUAL_SUBLEVEL → 配置标识: $REAL_CONFIG"

      - name: 打包工具链并上传 Release
        env:
          GIT_TOKEN: ${{ secrets.SCRIPT_REPO_PAT }}
          GH_TOKEN: ${{ secrets.SCRIPT_REPO_PAT }}
        run: |
          set -euo pipefail
          cd "$KERNEL_ROOT"

          echo "清理 .repo 目录..."
          rm -rf .repo
          find . -type d -name ".git" -exec rm -rf {} + 2>/dev/null || true

          # 删除内核源码，只保留 Bazel 工具链
          if [ -d "common" ]; then
            COMMON_SIZE=$(du -sh common | cut -f1)
            echo "删除 common/ 内核源码 ($COMMON_SIZE)..."
            rm -rf common
          fi

          # 计算剩余工具链大小
          TOOLCHAIN_SIZE=$(du -sh . | cut -f1)
          echo "剩余工具链大小: $TOOLCHAIN_SIZE"

          TARBALL="bazel-toolchain-${{ env.REAL_CONFIG }}.tar.gz"
          echo "压缩为 $TARBALL ..."
          tar czf "$TARBALL" . \
            --exclude='.repo' \
            --exclude='.git' \
            --exclude='*.tar.gz'

          TARBALL_SIZE=$(du -sh "$TARBALL" | cut -f1)
          echo "压缩包大小: $TARBALL_SIZE"

          echo "========================================="
          echo "上传到 Release: ${{ inputs.release_tag }}"
          echo "========================================="

          # 带重试的上传
          MAX_RETRIES=3
          for i in $(seq 1 $MAX_RETRIES); do
            echo "上传尝试 $i/$MAX_RETRIES ..."
            if gh release upload "${{ inputs.release_tag }}" "$TARBALL" \
              -R "${{ github.repository }}" --clobber 2>&1; then
              echo "上传成功！"
              exit 0
            fi
            if [ $i -lt $MAX_RETRIES ]; then
              WAIT=$(( i * 30 + RANDOM % 15 ))
              echo "上传失败，等待 ${WAIT} 秒后重试..."
              sleep $WAIT
            fi
          done

          echo "上传最终失败！"
          exit 1