name: 完整源码环境发布 - Android 13 (5.15)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "上传到的 Release 标签"
        required: true
        type: string
        default: "full-kernel-sources"
      part_size:
        description: "分卷大小，需低于 GitHub 单 asset 限制"
        required: true
        type: string
        default: "1900M"
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
        default: "full-kernel-sources"
      part_size:
        required: false
        type: string
        default: "1900M"
      kernelsu_variant:
        required: false
        type: string
      kernelsu_branch:
        required: false
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
      use_zram:
        required: false
        type: boolean
        default: false
      use_bbg:
        required: false
        type: boolean
        default: false
      use_kpm:
        required: false
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cancel_susfs:
        required: false
        type: boolean
        default: false
      droidspaces:
        required: false
        type: string
      called_from_main:
        required: false
        type: boolean
        default: false

jobs:
  publish-sources:
    name: "5.15.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - sub_level: "41"
            os_patch_level: "2022-11"
          - sub_level: "74"
            os_patch_level: "2023-01"
          - sub_level: "78"
            os_patch_level: "2023-03"
          - sub_level: "94"
            os_patch_level: "2023-05"
          - sub_level: "104"
            os_patch_level: "2023-07"
          - sub_level: "119"
            os_patch_level: "2023-09"
          - sub_level: "123"
            os_patch_level: "2023-11"
          - sub_level: "137"
            os_patch_level: "2024-01"
          - sub_level: "144"
            os_patch_level: "2024-03"
          - sub_level: "148"
            os_patch_level: "2024-05"
          - sub_level: "149"
            os_patch_level: "2024-07"
          - sub_level: "151"
            os_patch_level: "2024-08"
          - sub_level: "153"
            os_patch_level: "2024-09"
          - sub_level: "167"
            os_patch_level: "2024-11"
          - sub_level: "170"
            os_patch_level: "2025-01"
          - sub_level: "178"
            os_patch_level: "2025-03"
          - sub_level: "180"
            os_patch_level: "2025-05"
          - sub_level: "185"
            os_patch_level: "2025-07"
          - sub_level: "189"
            os_patch_level: "2025-09"
          - sub_level: "194"
            os_patch_level: "2025-12"
          - sub_level: "X"
            os_patch_level: "lts"
    uses: ./.github/workflows/kernel-full-release.yml
    secrets: inherit
    with:
      android_version: "android13"
      kernel_version: "5.15"
      os_patch_level: ${{ matrix.os_patch_level }}
      release_tag: ${{ inputs.release_tag || 'full-kernel-sources' }}
      part_size: ${{ inputs.part_size || '1900M' }}
